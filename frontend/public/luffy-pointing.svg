<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Body -->
  <ellipse cx="100" cy="220" rx="35" ry="50" fill="#FDBCB4"/>
  
  <!-- Red Vest -->
  <path d="M65 180 Q100 175 135 180 L130 250 Q100 255 70 250 Z" fill="#D32F2F"/>
  <path d="M75 180 L80 250" stroke="#B71C1C" stroke-width="1" fill="none"/>
  <path d="M125 180 L120 250" stroke="#B71C1C" stroke-width="1" fill="none"/>
  
  <!-- Chest (skin showing through open vest) -->
  <ellipse cx="100" cy="205" rx="20" ry="25" fill="#FDBCB4"/>
  
  <!-- Scar on chest -->
  <path d="M88 195 Q100 210 112 195" stroke="#C9A08A" stroke-width="1.5" fill="none"/>
  
  <!-- Blue Shorts -->
  <rect x="72" y="248" width="56" height="35" rx="5" fill="#1565C0"/>
  <line x1="100" y1="248" x2="100" y2="283" stroke="#0D47A1" stroke-width="1"/>
  
  <!-- Left Leg -->
  <rect x="78" y="280" width="16" height="25" rx="4" fill="#FDBCB4"/>
  <!-- Left Sandal -->
  <ellipse cx="86" cy="308" rx="14" ry="5" fill="#5D4037"/>
  <rect x="80" y="303" width="12" height="3" rx="1" fill="#8D6E63"/>
  
  <!-- Right Leg -->
  <rect x="106" y="280" width="16" height="25" rx="4" fill="#FDBCB4"/>
  <!-- Right Sandal -->
  <ellipse cx="114" cy="308" rx="14" ry="5" fill="#5D4037"/>
  <rect x="108" y="303" width="12" height="3" rx="1" fill="#8D6E63"/>
  
  <!-- Left Arm (on hip) -->
  <path d="M65 185 Q50 210 60 235" stroke="#FDBCB4" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="60" cy="237" r="7" fill="#FDBCB4"/>
  
  <!-- Right Arm (pointing!) -->
  <path d="M135 185 Q160 170 185 155" stroke="#FDBCB4" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Right Hand/Finger pointing -->
  <circle cx="185" cy="153" r="7" fill="#FDBCB4"/>
  <line x1="185" y1="153" x2="200" y2="145" stroke="#FDBCB4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Neck -->
  <rect x="92" y="155" width="16" height="18" rx="4" fill="#FDBCB4"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="125" rx="32" ry="35" fill="#FDBCB4"/>
  
  <!-- Hair (black messy) -->
  <path d="M68 120 Q65 95 80 85 Q90 75 100 80 Q110 75 120 85 Q135 95 132 120" fill="#1A1A2E"/>
  <path d="M68 120 Q60 115 65 130" fill="#1A1A2E"/>
  <path d="M132 120 Q140 115 135 130" fill="#1A1A2E"/>
  <!-- Side hair spikes -->
  <path d="M65 110 Q55 105 60 120" fill="#1A1A2E"/>
  <path d="M135 110 Q145 105 140 120" fill="#1A1A2E"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="122" rx="6" ry="7" fill="white"/>
  <circle cx="90" cy="122" r="4" fill="#1A1A2E"/>
  <circle cx="91" cy="121" r="1.5" fill="white"/>
  
  <ellipse cx="112" cy="122" rx="6" ry="7" fill="white"/>
  <circle cx="110" cy="122" r="4" fill="#1A1A2E"/>
  <circle cx="111" cy="121" r="1.5" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M82 113 Q88 110 94 113" stroke="#1A1A2E" stroke-width="2.5" fill="none"/>
  <path d="M106 113 Q112 110 118 113" stroke="#1A1A2E" stroke-width="2.5" fill="none"/>
  
  <!-- Nose -->
  <path d="M100 126 Q98 132 100 134" stroke="#E8A090" stroke-width="1.5" fill="none"/>
  
  <!-- Big Smile -->
  <path d="M82 138 Q100 155 118 138" stroke="#1A1A2E" stroke-width="2" fill="white"/>
  <path d="M85 138 Q100 148 115 138" fill="#D32F2F" opacity="0.3"/>
  
  <!-- Under-eye scar (left) -->
  <path d="M82 125 L84 132" stroke="#C9A08A" stroke-width="1"/>
  
  <!-- Straw Hat -->
  <ellipse cx="100" cy="95" rx="42" ry="8" fill="#F5C518"/>
  <path d="M65 95 Q65 65 100 60 Q135 65 135 95" fill="#F5C518"/>
  <path d="M65 95 Q100 100 135 95" fill="#E6B800"/>
  <!-- Hat band -->
  <rect x="65" y="88" width="70" height="8" rx="2" fill="#D32F2F"/>
  <!-- Hat texture lines -->
  <path d="M75 70 Q100 65 125 70" stroke="#E6B800" stroke-width="0.8" fill="none"/>
  <path d="M72 78 Q100 73 128 78" stroke="#E6B800" stroke-width="0.8" fill="none"/>
</svg>
