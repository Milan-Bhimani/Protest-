services:
  - type: web
    name: strawhatpress-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INGESTION_API_KEY
        sync: false
      - key: REVALIDATION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@strawhatpress.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: '["https://strawhatpress.in", "https://www.strawhatpress.in"]'
      - key: NEXTJS_URL
        value: https://strawhatpress.in
      - key: NEXTJS_REVALIDATION_URL
        value: https://strawhatpress.in/api/revalidate
      - key: PYTHON_VERSION
        value: "3.11.9"
