services:
  - type: web
    name: strawhatpress-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/platform.db
      - key: SECRET_KEY
        value: dev_secret_key_please_change_in_production
      - key: INGESTION_API_KEY
        value: dev-ingest-key
